name: Build and release

on:
  push:
    branches: [master, unified-feedback]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-packaging:
    name: Test release packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v

  build:
    name: Build ${{ matrix.target }}
    needs: test-packaging
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [UG, UG2, MW, CB, UC, PS, W]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build 32-bit release plugin
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if not defined VSCMD_ARG_TGT_ARCH exit /b 1
          call build.cmd ${{ matrix.target }}
          if errorlevel 1 exit /b 1
          call tests\runtime.cmd ${{ matrix.target }}
          if errorlevel 1 exit /b 1
          if "${{ matrix.target }}"=="PS" call tests\input.cmd
          if errorlevel 1 exit /b 1
          if "${{ matrix.target }}"=="PS" call tests\prostreet.cmd
          if errorlevel 1 exit /b 1
          if "${{ matrix.target }}"=="MW" call tests\mw.cmd
          if errorlevel 1 exit /b 1
          if "${{ matrix.target }}"=="CB" call tests\cb.cmd

      - name: Package with official release layout
        shell: pwsh
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python scripts/release.py package --game $env:BUILD_TARGET --repository $env:SOURCE_REPOSITORY --commit $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload game package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: game-package-${{ matrix.target }}
          path: dist/Release-*-Pack.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  collect:
    name: Assemble release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: game-package-*
          path: dist
          merge-multiple: true
      - name: Require all seven packages and calculate checksums
        run: python3 scripts/release.py checksums
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Create draft prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - name: Write release notes with current support status
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/release.py notes --repository "$SOURCE_REPOSITORY" --commit "$SOURCE_COMMIT" --output-file release-notes.md
      - name: Create or resume the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Release already published; refusing to replace its assets. Push a new tag."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md --prerelease
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --draft --prerelease
          fi
